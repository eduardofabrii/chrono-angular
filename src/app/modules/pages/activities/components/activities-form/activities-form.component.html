<p-dialog [header]="editingActivity ? 'Editar atividade' : 'Nova atividade'" [(visible)]="isFormVisible" [modal]="true"
          [style]="{ width: '35rem' }" [breakpoints]="{ '575px': '95vw' }" [draggable]="false">
  <form [formGroup]="activityForm" class="dialog-form">
    <div class="project-info">
      <span>Projeto <b>{{ projectName || '—' }}</b><ng-container *ngIf="projectPeriod"> · período <span class="num">{{ projectPeriod }}</span></ng-container></span>
    </div>
    <div class="p-field">
      <label for="a-name">Nome da atividade</label>
      <input id="a-name" pInputText formControlName="name" placeholder="Ex.: Tela de acompanhamento de entregas" />
    </div>
    <div class="p-field">
      <label for="a-desc">Descrição</label>
      <textarea id="a-desc" pInputTextarea formControlName="description" rows="2"></textarea>
    </div>
    <div class="dialog-grid">
      <div class="p-field">
        <label for="a-resp">Responsável</label>
        <p-dropdown inputId="a-resp" [options]="responsibleOptions" formControlName="responsible" optionLabel="name" placeholder="Selecione" appendTo="body"></p-dropdown>
      </div>
      <div class="p-field">
        <label for="a-status">Status</label>
        <p-dropdown inputId="a-status" [options]="statusOptions" formControlName="status" optionLabel="label" optionValue="value" appendTo="body"></p-dropdown>
      </div>
      <div class="p-field">
        <label for="a-start">Data de início</label>
        <p-calendar inputId="a-start" formControlName="startDate" dateFormat="dd/mm/yy" appendTo="body"></p-calendar>
      </div>
      <div class="p-field">
        <label for="a-end">Data de fim</label>
        <p-calendar inputId="a-end" formControlName="endDate" dateFormat="dd/mm/yy" placeholder="dd/mm/aaaa" appendTo="body"></p-calendar>
      </div>
    </div>
    <span class="hint">As datas precisam estar dentro do período do projeto.</span>
  </form>
  <ng-template pTemplate="footer">
    <button *ngIf="editingActivity" pButton type="button" label="Excluir" class="p-button-danger footer-start" (click)="openDeleteDialog()"></button>
    <button pButton type="button" label="Cancelar" class="p-button-secondary" (click)="isFormVisible = false"></button>
    <button pButton type="button" [label]="editingActivity ? 'Salvar' : 'Criar'" (click)="save()"></button>
  </ng-template>
</p-dialog>

<p-dialog header="Excluir atividade" [(visible)]="isDeleteVisible" [modal]="true" [style]="{ width: '28rem' }" [breakpoints]="{ '575px': '95vw' }" [draggable]="false">
  <p class="dialog-text">Excluir <b>{{ editingActivity?.name }}</b>? Essa ação não pode ser desfeita.</p>
  <ng-template pTemplate="footer">
    <button pButton type="button" label="Cancelar" class="p-button-secondary" (click)="isDeleteVisible = false"></button>
    <button pButton type="button" label="Excluir" class="p-button-danger" (click)="deleteActivity()"></button>
  </ng-template>
</p-dialog>
