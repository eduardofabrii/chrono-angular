<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Chrono</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F7">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Aplica o tema antes do Angular carregar para evitar flash de tema claro
    document.documentElement.setAttribute('data-theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chrono">
</head>
<body>
  <app-root>
    <style>
      .chrono-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:#F5F5F7}
      .chrono-splash img{width:210px;height:auto}
      .chrono-splash .dark-logo{display:none}
      .chrono-splash svg{animation:chrono-spin 1.1s linear infinite}
      @keyframes chrono-spin{to{transform:rotate(360deg)}}
      @media (prefers-color-scheme: dark){.chrono-splash{background:#101012}.chrono-splash .light-logo{display:none}.chrono-splash .dark-logo{display:block}}
    </style>
    <div class="chrono-splash" aria-label="Carregando o Chrono">
      <img class="light-logo" src="assets/imgs/chrono-logo.png" alt="Chrono">
      <img class="dark-logo" src="assets/imgs/chrono-logo-dark.png" alt="Chrono">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" style="overflow:visible"><path d="M10 3.5v10.5l7 6.5" fill="none" stroke="#F0A800" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </app-root>
  <noscript>Ative o JavaScript para usar o Chrono.</noscript>
</body>
</html>
